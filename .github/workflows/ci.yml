name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck rofi/.config/rofi/scripts/*.sh foot/.local/bin/foot-theme tmux/.local/bin/tmux-dev tmux/.local/bin/tmux-ssh raspi/.local/bin/tmux-claude river/.local/bin/toggle-main-term river/.local/bin/notify-volume install.sh

  python:
    name: Python syntax (river/init)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile-check river/init
        run: python3 -m py_compile river/.config/river/init

  luacheck:
    name: Luacheck (nvim config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck nvim/.config/nvim

  jsonc:
    name: Validate waybar config.jsonc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JSONC
        run: python3 .github/scripts/validate_jsonc.py waybar/.config/waybar/config.jsonc

  stow-dry-run:
    name: Stow dry-run (no conflicts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Dry-run stow every package
        run: |
          set -e
          fake_home="$(mktemp -d)"
          for pkg in */; do
            pkg="${pkg%/}"
            echo "::group::stow -n ${pkg}"
            stow -n -v -d "$PWD" -t "$fake_home" "$pkg"
            echo "::endgroup::"
          done

  zsh-syntax:
    name: Zsh syntax (zshrc's)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax-check every zshrc
        run: |
          set -e
          for f in zsh/.zshrc raspi/.zshrc macos/.zshrc; do
            echo "::group::zsh -n ${f}"
            zsh -n "$f"
            echo "::endgroup::"
          done

  tmux-config:
    name: Tmux config (parses cleanly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Load each tmux config into a detached session
        run: |
          set -e
          # `new-session -f <conf>` swallows config parse errors -- it exits 0
          # even when a line fails (e.g. an unknown option value), since tmux
          # only reports that on an interactive attach. `source-file` against
          # an already-running session does propagate a nonzero exit and
          # print the offending line, so start bare and source the real
          # config as a second step to actually catch parse errors here.
          # raspi/.config/tmux/tmux.conf is a separate, plugin-free
          # alternative to tmux/.config/tmux/tmux.conf (never stowed
          # together -- see the repo's stow-dry-run job), so both need
          # their own check.
          for conf in tmux/.config/tmux/tmux.conf raspi/.config/tmux/tmux.conf; do
            echo "::group::source-file ${conf}"
            tmux -f /dev/null new-session -d -s ci-check
            tmux source-file "$conf"
            tmux kill-server
            echo "::endgroup::"
          done
