# Raspi's own tmux config -- an alternative to the shared tmux/.config/tmux
# package, not a copy of it. Same XDG target (~/.config/tmux/tmux.conf), so
# these are alternatives like raspi's nvim/zsh already are: stow one or the
# other, never both. Deliberately simpler than the shared config: no plugin
# manager, no Mocha/Frappe duality, no icons, no date, a single status line
# -- raspi has no display of its own and is always viewed through an
# already-ssh'd terminal (which has already flipped to Catppuccin Frappe;
# see foot-theme / the macOS iTerm2 profile switch), so there's no "you're
# now remote" signal to add here the way the desktop config needs one.

# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on  # relay copies to the outer terminal via OSC 52 --
                         # lands in the client's clipboard over SSH, no
                         # wl-copy/pbcopy needed on this headless box
set -g allow-passthrough on  # forward other OSC sequences too, e.g. this
                             # session's own chpwd cwd-reporting hook (see
                             # raspi/.zshrc) on its way back out to whatever
                             # you're viewing this from
set -g set-titles on
set -g set-titles-string "#S: #{pane_current_command}"
set -g history-limit 10000
set -g escape-time 10          # kill the Esc/O-key delay that fights nvim
set -g focus-events on         # lets nvim's autoread/autowrite react on pane focus
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ---- Nested-tmux passthrough toggle (F12) ----
# Every machine auto-attaches to a local `main` tmux session on login (see
# zsh), so SSH'ing from raspi's own `main` into yet another tmux'd machine
# nests one tmux session inside the other, and both listen for the same
# prefix and the same root-table binds (C-h/j/k/l, C-Tab below) -- since the
# inner session is the foreground process, it swallows everything, leaving
# no way to reach THIS (outer) session at all. F12 flips this session into
# a passthrough "OFF" mode -- unsets its prefix and switches its root key
# table to an empty one (`off`, populated with only the restore binding
# below), so every keystroke, prefix-based or not, reaches the inner
# session untouched. A glaring red status bar makes it obvious which mode
# you're in. See tmux/.config/tmux/tmux.conf for the live-keystroke
# confirmation this was tested with -- identical mechanism here.
bind -T root F12 \
    set -g prefix None \; \
    set -g key-table off \; \
    set -g status-style "bg=#{@thm_red},fg=#{@thm_crust}" \; \
    set -g status-left "#[fg=#{@thm_crust}]#[bold]  OFF -- F12 for local control  " \; \
    set -g status-right "" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S
bind -T off F12 \
    set -g prefix C-b \; \
    set -g key-table root \; \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "local control resumed"

# ---- Vi-style keys (matches the zsh vi-mode plugin) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ---- Splits / windows (keep the working directory) ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Ctrl-Tab window switching (browser-tab-style) ----
set -g extended-keys on
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# ---- Seamless nvim <-> tmux pane navigation ----
# Mirrors raspi's minimal nvim's <C-h/j/k/l> window-nav keymaps so the same
# keys move between tmux panes and nvim splits without a plugin.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ---- Catppuccin Frappe -- the only palette this file needs (see header) ----
set -g @thm_base "#303446"
set -g @thm_mantle "#292c3c"
set -g @thm_crust "#232634"
set -g @thm_text "#c6d0f5"
set -g @thm_subtext0 "#a5adce"
set -g @thm_surface0 "#414559"
set -g @thm_surface1 "#51576d"
set -g @thm_overlay0 "#737994"
set -g @thm_blue "#8caaee"
set -g @thm_lavender "#babbf1"
set -g @thm_peach "#ef9f76"
set -g @thm_green "#a6d189"
set -g @thm_red "#e78284"

set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_text}"

# ---- Status bar: one line, plain tmux default template (status-left +
# window list + status-right, all on the same line) -- no custom
# status-format needed since there's no icon/date content pushing this
# repo's usual truncation bug (status-left-length below is what actually
# fixes that, same value the shared config uses). Chips keep the same
# rounded-pill construction and colors as the shared config (lavender
# session, red ssh target, green cwd) but with no icon zone and no
# Mocha/Frappe ternary -- one color per chip, always on.
set -g status on
set -g status-left-length 200
set -g status-right-length 200
set -g status-right ""

# Same rounded-cap glyphs ( / , U+E0B6/U+E0B4) as the shared config -- see
# its comments for why this specific glyph pair over a newer icon set.
set -g status-left "#[fg=#{@thm_lavender}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_lavender}] #S #[fg=#{@thm_lavender}]#[bg=#{@thm_mantle}]#{?#{==:#{pane_current_command},ssh}, #[fg=#{@thm_red}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_red}] #{window_name} #[fg=#{@thm_red}]#[bg=#{@thm_mantle}],} #[fg=#{@thm_green}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_green}] #{pane_current_path} #[fg=#{@thm_green}]#[bg=#{@thm_mantle}]"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#{@thm_crust}]#[bg=#{@thm_lavender}] #I:#W "
setw -gF window-status-style "fg=#{@thm_subtext0}"
setw -gF window-status-activity-style "fg=#{@thm_peach}"

set -gF pane-border-style "fg=#{@thm_surface0}"
set -gF pane-active-border-style "fg=#{@thm_blue}"

# Shows each pane's running command on its border, highlighted when it's
# ssh -- per-pane, since a single OSC background change can't tell tmux
# panes apart.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_peach}]  SSH #{pane_current_command},#{pane_current_command}}"

set -gF message-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF message-command-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF display-panes-active-colour "#{@thm_blue}"
set -gF display-panes-colour "#{@thm_overlay0}"
setw -gF clock-mode-colour "#{@thm_blue}"
