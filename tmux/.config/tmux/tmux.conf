# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on  # relay copies to the outer terminal via OSC 52 --
                         # works locally (foot writes it to the Wayland
                         # clipboard, so cliphist still picks it up) and
                         # over SSH (lands in the client's clipboard, no
                         # wl-copy needed on a headless remote box)
set -g allow-passthrough on  # forward other OSC sequences too, e.g. the
                             # zsh `ssh` wrapper's foot-theme calls that
                             # switch foot to Catppuccin Frappe for the
                             # session -- tmux drops these by default
set -g set-titles on  # forward the window title to foot/iTerm2 -- off by
                      # default, same reason as allow-passthrough above
set -g set-titles-string "#S: #{pane_current_command}"  # e.g. "dev-dotfiles:
                                # nvim", or "dev-dotfiles: ssh" while the
                                # active pane is ssh'd -- the ssh target
                                # itself now lives on the status bar's red
                                # chip (below) instead of the window title,
                                # so the title's job stays this simple. The
                                # zsh `ssh` wrapper's own OSC 2 "SSH: <target>"
                                # sequence still runs (still useful outside
                                # tmux) but no longer reaches the title while
                                # inside tmux, since this format doesn't
                                # reference #T (the pane title it used to set)
                                # at all anymore.
set -g history-limit 10000
set -g escape-time 10          # kill the Esc/O-key delay that fights nvim
set -g focus-events on         # lets nvim's autoread/autowrite react on pane focus
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ---- Vi-style keys (matches the zsh vi-mode plugin) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ---- Splits / windows (keep the working directory) ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Ctrl-Tab window switching (browser-tab-style) ----
# Needs the terminal to report Ctrl/Shift+Tab as a distinct key rather than
# plain Tab -- `extended-keys on` asks tmux to parse that if the terminal
# sends it (confirmed as a real, settable tmux option: `show-options -g
# extended-keys` reports off/on correctly), but the terminal itself has to
# actually emit the extended sequence (xterm modifyOtherKeys / Kitty
# keyboard protocol / CSI u). Not verifiable from a sandbox with no real
# terminal attached -- if this doesn't fire on the real machine, that's a
# foot/iTerm2-side setting to chase, not a tmux-side one.
set -g extended-keys on
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# ---- Seamless nvim <-> tmux pane navigation ----
# Mirrors nvim's <C-h/j/k/l> window-nav keymaps (config/keymaps.lua) so the
# same keys move between tmux panes and nvim splits without a plugin.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ---- Catppuccin Mocha ----
set -g @thm_base "#1e1e2e"
set -g @thm_mantle "#181825"
set -g @thm_crust "#11111b"
set -g @thm_text "#cdd6f4"
set -g @thm_subtext0 "#a6adc8"
set -g @thm_surface0 "#313244"
set -g @thm_surface1 "#45475a"
set -g @thm_overlay0 "#6c7086"
set -g @thm_blue "#89b4fa"
set -g @thm_lavender "#b4befe"
set -g @thm_peach "#fab387"
set -g @thm_green "#a6e3a1"
set -g @thm_red "#f38ba8"

# ---- Catppuccin Frappe (status bar + pill caps while the focused pane is
# SSH'd -- a window-level complement to the pane-border SSH label below,
# same per-pane-granularity caveat: reflects the *focused* pane only) ----
set -g @thm_frappe_base "#303446"
set -g @thm_frappe_mantle "#292c3c"
set -g @thm_frappe_crust "#232634"
set -g @thm_frappe_text "#c6d0f5"
set -g @thm_frappe_surface1 "#51576d"
set -g @thm_frappe_blue "#8caaee"
set -g @thm_frappe_lavender "#babbf1"
set -g @thm_frappe_green "#a6d189"
set -g @thm_frappe_red "#e78284"

# Plain `set -g`, not `-gF` -- `-F` bakes a format into a static value once
# at set-time (fine for the @thm_* lookups elsewhere in this file, which
# never change after load), but this ternary depends on pane_current_command
# changing constantly at runtime, so it needs the same live-per-render
# treatment pane-border-format already gets below (also plain `set -g`, no
# -F). Confirmed live in a real tmux session: `-gF` here silently freezes
# the condition at its value when the option was set (still "not ssh" at
# that point), never re-evaluating -- switching to plain `set -g` fixed it.
set -g status-style "#{?#{==:#{pane_current_command},ssh},bg=#{@thm_frappe_mantle},bg=#{@thm_mantle}},#{?#{==:#{pane_current_command},ssh},fg=#{@thm_frappe_text},fg=#{@thm_text}}"

# ---- Status bar: rounded pills, powerline-style. Each pill's rounded caps
# ( / , U+E0B6/U+E0B4) come from the original Powerline Extra Symbols
# block -- the oldest, most stable part of the Nerd Font symbol set, so
# these render correctly on every Nerd Font variant rather than risking a
# tofu box from a newer icon set this hasn't been checked against. A cap's
# fg is the pill's own fill color and its bg is whatever's behind it (the
# bar's base), which is what makes it read as a curve instead of a hard
# edge -- same trick powerlevel10k/starship/oh-my-posh's "rounded" styles
# use. Built as two complete strings (Mocha/Frappe) picked by one outer
# ternary rather than interleaving small ternaries throughout, so the SSH
# condition is written once per option, not repeated (and risked typo'd)
# for every cap -- each inner #[...] block is then a plain literal, same
# principle as status-style above: only the outer wrapper needs the live
# per-render treatment (plain `set -g`, not `-F`).
#
# Each #[...] block sets exactly ONE attribute (#[fg=X]#[bg=Y], never
# #[fg=X,bg=Y]). A combined, comma-joined block would need its comma
# escaped as `\,` to keep the outer #{?cond,yes,no} ternary from treating
# it as the yes/no separator -- confirmed live (real pty capture via
# `script`, not just `show-options`, which only proves the stored value
# and hid this) that tmux does not reliably unescape `\,` back to a
# literal comma before the #[...] style parser sees it, so the block
# fails to parse and its content leaks as literal on-screen text (this
# shipped broken once already). Splitting into single-attribute blocks
# needs no comma anywhere inside a ternary branch, sidestepping the
# escaping question entirely.
# Two status lines: top is identity/context (session pill, SSH target when
# the focused pane is ssh'd, cwd, right-aligned date+time), bottom is the
# window list on its own -- keeps window pills from crowding the session
# pill for a long session name or cwd (they used to share one line and
# visibly collide -- status-left-length's old default of 10 was truncating
# the session pill mid-cap, which is what that collision actually was).
set -g status 3
set -g status-left-length 200
set -g status-right-length 80

# status-format[0]/[1] build each line explicitly rather than relying on
# tmux's own default template (which interleaves status-left/right with
# the window list on a single line). #{T:status-left} is required, not
# plain #{status-left} -- confirmed live that the bare form returns the
# *unexpanded* status-left string (its own #{...} references left as
# literal text untouched), while `T:` (tmux's "treat as format" prefix)
# runs a second expansion pass over it. Same reasoning applies to
# #{T:window-status-format} / #{T:window-status-current-format} inside
# the #{W:...,...} window-list loop below (also confirmed live: without
# `T:`, "#I:#W" prints literally instead of the real index/name).
set -g status-format[0] "#[align=left]#{T:status-left}#[align=right]#{T:status-right}"
set -g status-format[1] ""
set -g status-format[2] "#[align=left]#{W:#{T:window-status-format},#{T:window-status-current-format}}"

set -g status-left "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_frappe_surface1}]#[bg=#{@thm_frappe_mantle}]#[fg=#{@thm_frappe_lavender}]#[bg=#{@thm_frappe_surface1}] #S #[fg=#{@thm_frappe_surface1}]#[bg=#{@thm_frappe_mantle}] #[fg=#{@thm_frappe_red}]#[bg=#{@thm_frappe_mantle}]#[fg=#{@thm_frappe_crust}]#[bg=#{@thm_frappe_red}] #{window_name} #[fg=#{@thm_frappe_red}]#[bg=#{@thm_frappe_mantle}] #[fg=#{@thm_frappe_green}]#[bg=#{@thm_frappe_mantle}]#[fg=#{@thm_frappe_crust}]#[bg=#{@thm_frappe_green}] #{pane_current_path} #[fg=#{@thm_frappe_green}]#[bg=#{@thm_frappe_mantle}],#[fg=#{@thm_surface1}]#[bg=#{@thm_mantle}]#[fg=#{@thm_lavender}]#[bg=#{@thm_surface1}] #S #[fg=#{@thm_surface1}]#[bg=#{@thm_mantle}] #[fg=#{@thm_green}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_green}] #{pane_current_path} #[fg=#{@thm_green}]#[bg=#{@thm_mantle}]}"
set -g status-right "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_frappe_blue}]#[bg=#{@thm_frappe_mantle}]#[fg=#{@thm_frappe_crust}]#[bg=#{@thm_frappe_blue}]#[bold] %a %d %b  %H:%M #[fg=#{@thm_frappe_blue}]#[bg=#{@thm_frappe_mantle}],#[fg=#{@thm_blue}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_blue}]#[bold] %a %d %b  %H:%M #[fg=#{@thm_blue}]#[bg=#{@thm_mantle}]}"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_frappe_blue}]#[bg=#{@thm_frappe_mantle}]#[fg=#{@thm_frappe_crust}]#[bg=#{@thm_frappe_blue}]#[bold] #I:#W #[fg=#{@thm_frappe_blue}]#[bg=#{@thm_frappe_mantle}],#[fg=#{@thm_blue}]#[bg=#{@thm_mantle}]#[fg=#{@thm_crust}]#[bg=#{@thm_blue}]#[bold] #I:#W #[fg=#{@thm_blue}]#[bg=#{@thm_mantle}]}"
setw -gF window-status-style "fg=#{@thm_subtext0}"
setw -gF window-status-activity-style "fg=#{@thm_peach}"

set -gF pane-border-style "fg=#{@thm_surface0}"
set -gF pane-active-border-style "fg=#{@thm_blue}"

# Shows each pane's running command on its border, highlighted when it's
# ssh -- a per-pane complement to foot's whole-window Frappe switch, since
# OSC background changes can't tell tmux panes apart: if only one pane in
# the window is SSH'd, foot still recolors the entire window.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_peach}]  SSH #{pane_current_command},#{pane_current_command}}"

set -gF message-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF message-command-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF display-panes-active-colour "#{@thm_blue}"
set -gF display-panes-colour "#{@thm_overlay0}"
setw -gF clock-mode-colour "#{@thm_blue}"

# ---- Plugins (TPM) ----
# tmux-which-key: prefix+Space opens a menu of common actions (windows,
# panes, buffers, sessions, copy-mode, client) -- confirmed live that this
# is its actual default binding (root-table Ctrl+Space, documented as
# another default trigger, isn't registered unless separately configured,
# so it doesn't collide with any of the C-h/j/k/l/Tab root-table binds
# above).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# install.sh clones TPM to this exact path and runs its headless installer
# on a fresh machine, so plugins are ready without a manual `prefix + I`.
# Guarded on TPM actually being present: an unguarded `run` against a
# missing path exits non-zero (confirmed live) and would fail the CI
# tmux-config job, which sources this file into a real session with no
# TPM clone anywhere nearby -- this keeps a fresh checkout (CI, or a
# machine before its first install.sh run) sourcing cleanly instead of
# erroring on a plugin manager that isn't there yet.
if "test -f #{HOME}/.config/tmux/plugins/tpm/tpm" "run '#{HOME}/.config/tmux/plugins/tpm/tpm'"
