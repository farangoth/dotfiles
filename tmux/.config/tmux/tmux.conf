# ---- General ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on  # relay copies to the outer terminal via OSC 52 --
                         # works locally (foot writes it to the Wayland
                         # clipboard, so cliphist still picks it up) and
                         # over SSH (lands in the client's clipboard, no
                         # wl-copy needed on a headless remote box)
set -g allow-passthrough on  # forward other OSC sequences too, e.g. the
                             # zsh `ssh` wrapper's foot-theme calls that
                             # switch foot to Catppuccin Frappe for the
                             # session -- tmux drops these by default
set -g set-titles on  # forward the zsh `ssh` wrapper's window-title OSC
                      # sequence to foot too, via #T below -- off by
                      # default, same reason as allow-passthrough above
set -g set-titles-string "#T"  # clean passthrough of the pane title (the
                                # ssh() wrapper's "SSH: <target>" OSC 2
                                # sequence) -- tmux's own default format
                                # wraps it as "session:window - title"
                                # instead of forwarding it as-is
set -g history-limit 10000
set -g escape-time 10          # kill the Esc/O-key delay that fights nvim
set -g focus-events on         # lets nvim's autoread/autowrite react on pane focus
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ---- Vi-style keys (matches the zsh vi-mode plugin) ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ---- Splits / windows (keep the working directory) ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Seamless nvim <-> tmux pane navigation ----
# Mirrors nvim's <C-h/j/k/l> window-nav keymaps (config/keymaps.lua) so the
# same keys move between tmux panes and nvim splits without a plugin.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ---- Catppuccin Mocha ----
set -g @thm_base "#1e1e2e"
set -g @thm_mantle "#181825"
set -g @thm_crust "#11111b"
set -g @thm_text "#cdd6f4"
set -g @thm_subtext0 "#a6adc8"
set -g @thm_surface0 "#313244"
set -g @thm_surface1 "#45475a"
set -g @thm_overlay0 "#6c7086"
set -g @thm_blue "#89b4fa"
set -g @thm_lavender "#b4befe"
set -g @thm_peach "#fab387"

# ---- Catppuccin Frappe (status bar base while the focused pane is SSH'd --
# a window-level complement to the pane-border SSH label below, same
# per-pane-granularity caveat: reflects the *focused* pane only) ----
set -g @thm_frappe_base "#303446"
set -g @thm_frappe_mantle "#292c3c"
set -g @thm_frappe_text "#c6d0f5"

# Plain `set -g`, not `-gF` -- `-F` bakes a format into a static value once
# at set-time (fine for the @thm_* lookups elsewhere in this file, which
# never change after load), but this ternary depends on pane_current_command
# changing constantly at runtime, so it needs the same live-per-render
# treatment pane-border-format already gets below (also plain `set -g`, no
# -F). Confirmed live in a real tmux session: `-gF` here silently freezes
# the condition at its value when the option was set (still "not ssh" at
# that point), never re-evaluating -- switching to plain `set -g` fixed it.
set -g status-style "#{?#{==:#{pane_current_command},ssh},bg=#{@thm_frappe_mantle},bg=#{@thm_mantle}},#{?#{==:#{pane_current_command},ssh},fg=#{@thm_frappe_text},fg=#{@thm_text}}"
set -g status-left ""
set -g status-right-length 60
set -g status-right "#[fg=#{@thm_surface1},bg=#{@thm_mantle}]#[fg=#{@thm_lavender},bg=#{@thm_surface1}] #S #[fg=#{@thm_blue},bg=#{@thm_surface1}]#[fg=#{@thm_crust},bg=#{@thm_blue},bold] %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_blue},bold] #I:#W "
setw -gF window-status-style "fg=#{@thm_subtext0}"
setw -gF window-status-activity-style "fg=#{@thm_peach}"

set -gF pane-border-style "fg=#{@thm_surface0}"
set -gF pane-active-border-style "fg=#{@thm_blue}"

# Shows each pane's running command on its border, highlighted when it's
# ssh -- a per-pane complement to foot's whole-window Frappe switch, since
# OSC background changes can't tell tmux panes apart: if only one pane in
# the window is SSH'd, foot still recolors the entire window.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_current_command},ssh},#[fg=#{@thm_peach}]  SSH #{pane_current_command},#{pane_current_command}}"

set -gF message-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF message-command-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF display-panes-active-colour "#{@thm_blue}"
set -gF display-panes-colour "#{@thm_overlay0}"
setw -gF clock-mode-colour "#{@thm_blue}"
