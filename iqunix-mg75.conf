245a:8276

# This board has only ONE key in the tilde/grave/ISO-extra family (evdev
# reports it as "102nd" -- confirmed live via `keyd monitor`; there is no
# separate physical "grave" key on this keyboard despite xkb keycode
# arithmetic suggesting otherwise).
#
# Every mapping below is a raw keycode redirect to a key that ALREADY
# carries the wanted symbol somewhere in gb's own "basic" xkb symbols
# (/usr/share/X11/xkb/rules -> symbols/gb), cross-checked against the
# shipped "gb(mac)" variant ("English (UK, Macintosh)") for what the
# Iqunix's own keycaps expect. This avoids keyd's literal-Unicode macro
# path entirely, which proved unreliable here: it depends on
# ~/.XCompose being wired up AND on keyd's assumed base layout matching
# the display server's actual "gb" layout, and in practice its bare
# single-char macros were also observed silently reusing whatever real
# modifier was already held (e.g. a bare "~" while real Shift was down
# came out as plain grave, not tilde) rather than generating their own
# self-contained sequence.

[main]
102nd = grave
# gb's own LSGT (102nd) key is [backslash, bar] at levels 1/2 -- exactly
# the \\/| this physical key's cap wants. Full-key redirect in [main]
# (not a modifier-layer override) keeps normal Shift flow-through, so
# the shifted case (|) works automatically with no separate [shift]
# entry needed.
backslash = 102nd
# Redirect this device's own CapsLock to Menu, which river/init's
# global `compose:menu` xkb option dedicates as the Multi_key/compose
# trigger (needed for the accented-letter macros below to resolve
# instead of emitting garbage). Deliberately NOT done by rebinding
# CapsLock itself globally (that key is already `caps:escape` for both
# keyboards) -- this redirect happens below the xkb layer and is scoped
# to this device's [ids] match, so the ThinkPad's CapsLock->Escape is
# completely unaffected; it never sees a redirected event from this
# keyboard.
capslock = menu

[shift]
# gb's own AE02 ("2") key is [2, quotedbl] -- Shift+2 is already a
# double quote ("), and gb's own AC11 (apostrophe) key is
# [apostrophe, at] -- Shift+apostrophe is already "@". A straight swap:
# borrowing each other's native gb shift-level symbol. An override
# inside a modifier layer does NOT inherit that layer's own modifier
# (same rule as the `capslock+j` example in `man keyd`) -- confirmed
# live earlier that omitting S- here drops Shift entirely, so both
# reassert it explicitly.
2 = S-apostrophe
apostrophe = S-2
# gb's own BKSL (backslash) key is [numbersign, asciitilde] -- Shift+
# backslash is already "~". Same S- reassertion as above.
102nd = S-backslash

[altgr]
# gb's own AE04 ("4") key is [4, dollar, EuroSign] at level 3 -- AltGr+4
# is already Euro. G- (AltGr) re-asserts the modifier the same way S-
# does for Shift above.
2 = G-4
# gb's own LSGT/102nd key's *raw* meaning is backslash -- redirecting
# without a G- prefix deliberately drops AltGr (same suppression rule),
# landing on backslash's own unshifted gb level (numbersign/#).
3 = backslash
# Opt+E: arm a one-shot acute-accent layer for the *next* keypress,
# mimicking a real Mac dead key (evdev/keyd have no dead-key concept of
# their own -- this reimplements it via keyd's layer mechanism). The
# literal accented characters below need working compose (see
# capslock=menu above and river/init's compose:menu option) to resolve
# correctly rather than emitting garbage, which is what happened before
# that plumbing was in place.
e = oneshot(acute)

[acute]
a = á
e = é
i = í
o = ó
u = ú
y = ý
